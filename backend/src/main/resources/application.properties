spring.application.name=sentinel
server.port=8081
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/sentinel}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=false
app.cors.origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.jwt.secret=${JWT_SECRET:sentinel-local-development-secret-at-least-32-bytes-change-in-production}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:300}
app.demo.enabled=${DEMO_ENABLED:true}
server.error.include-message=never

debug=false
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=WARN
